<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bucks2Bar - Budget Tracker</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom Styles -->
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">💰 Bucks2Bar - Budget Tracker</span>
        </div>
    </nav>

    <div class="container mt-5">
        <!-- Tab Navigation -->
        <ul class="nav nav-tabs mb-4" id="mainTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="data-tab" data-bs-toggle="tab" data-bs-target="#data" type="button"
                    role="tab" aria-controls="data" aria-selected="true">
                    📊 Data
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="chart-tab" data-bs-toggle="tab" data-bs-target="#chart" type="button"
                    role="tab" aria-controls="chart" aria-selected="false">
                    📈 Chart
                </button>
            </li>
        </ul>

        <!-- Tab Content -->
        <div class="tab-content" id="mainTabContent">

            <!-- Data Tab -->
            <div class="tab-pane fade show active" id="data" role="tabpanel" aria-labelledby="data-tab">
                <div class="mb-4">
                    <h3>Monthly Income & Expenses (2026)</h3>
                    <p class="text-muted">Enter your monthly income and expenses below.</p>
                </div>

                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>Month</th>
                                <th>Income ($)</th>
                                <th>Expense ($)</th>
                            </tr>
                        </thead>
                        <tbody id="monthlyDataTable">
                            <!-- Generated by JavaScript -->
                        </tbody>
                    </table>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button class="btn btn-warning" id="clearBtn">🗑️ Clear All Data</button>
                </div>
            </div>

            <!-- Chart Tab -->
            <div class="tab-pane fade" id="chart" role="tabpanel" aria-labelledby="chart-tab">
                <div class="mb-4">
                    <h3>Income vs Expenses Chart</h3>
                    <p class="text-muted">Visual comparison of monthly income and expenses.</p>
                </div>

                <div class="chart-container">
                    <canvas id="incomeExpenseChart"></canvas>
                </div>
            </div>

        </div>
    </div>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom Script -->
    <script src="script.js"></script>
</body>

</html>
